name: CI/CD

# main 上的每個 commit 都必須有對應的 :sha 映像——promote、rollback、bisect 都靠這個不變量。
# 所以不設 paths-ignore（純文件 commit 也照建）；重複建置的成本由下方 build cache 吸收。
on:
  push:
    branches: [main]
    tags: ['v*']           # 打 v* tag → 發版到 prod
  pull_request:
    branches: [main]

# 同一個 ref 一次只跑一條 pipeline。連續 merge 時後者排隊等前者結束——
# 否則 sha A 的 deploy 可能在 sha B 之後才完成，環境最後跑到的是舊版。
# PR 例外：新 commit 直接取消舊 run（PR 不會部署，沒有中斷部署的風險）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI：後端測試（PR / main / tag 都跑）----------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # ---------- CI：前端建置檢查 ----------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ========== merge 到 main：build 兩個映像 + 自動部署 dev → qas（不含 prod）==========
  build:
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # cache 匯出需要 buildx 的 container driver；預設 docker driver 不支援 type=gha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}
          # scope 必須分開：兩個 matrix job 共用同一組 cache key 會互相覆寫
          # mode=max 才會快取多階段建置的中間 stage（backend 有 base/dev/runtime）
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 以下三個 deploy job 目前「只印指令」，不連線任何主機。它們保留著是因為結構本身有價值：
  # job 圖形顯示 promotion 順序、environment 是日後掛各環境 SSH secrets 的作用域、
  # production 的 required reviewers 是真實生效的核准閘門。接上主機時是填空，不是重新設計。
  # 代價：Environments 會留下不代表實際部署的紀錄——所以 job 名稱直說，文件也如實描述。
  # 注意這些都依賴 Environments 可用：免費方案的 private repo 不支援（見 docs/cicd.md）。
  deploy-dev:
    name: deploy-dev (prints command only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 dev 主機執行下列指令
      - run: |
          {
            echo "### dev：尚未接上主機，請自行在 dev 主機上執行"
            echo '```bash'
            echo "make deploy MODE=<擇一> ENV=dev IMAGE=${{ env.IMAGE }} TAG=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-qas:
    name: deploy-qas (prints command only)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qas
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 qas 主機執行下列指令
      - run: |
          {
            echo "### qas：尚未接上主機，請自行在 qas 主機上執行"
            echo '```bash'
            echo "make deploy MODE=<擇一> ENV=qas IMAGE=${{ env.IMAGE }} TAG=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ========== 打 v* tag：發版到 prod（兩個映像加版本標籤，不重 build）==========
  release:
    needs: [test-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 不重 build：把 tag 指到的 commit 的 :sha 映像，加上版本標籤（build-once）
      - run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.ref_name }} \
            ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}

  deploy-prod:
    name: deploy-prod (prints command only)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # 在 GitHub 設 required reviewers → 上 prod 需人工核准
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 prod 主機執行下列指令
      - run: |
          {
            echo "### prod：尚未接上主機，請自行在 prod 主機上執行"
            echo '```bash'
            echo "make deploy MODE=<擇一> ENV=prod IMAGE=${{ env.IMAGE }} TAG=${{ github.ref_name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
