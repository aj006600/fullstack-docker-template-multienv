name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:          # 純文件變更不觸發 build/deploy（PR 仍會跑測試）
      - '**.md'
      - 'docs/**'
    tags: ['v*']           # 打 v* tag → 發版到 prod
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI：後端測試（PR / main / tag 都跑）----------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # ---------- CI：前端建置檢查 ----------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ========== merge 到 main：build 兩個映像 + 自動部署 dev → qas（不含 prod）==========
  build:
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}

  deploy-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 dev 主機執行下列指令
      - run: |
          echo "在 dev 主機上執行："
          echo "  make deploy MODE=<擇一> ENV=dev IMAGE=${{ env.IMAGE }} TAG=${{ github.sha }}"

  deploy-qas:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qas
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 qas 主機執行下列指令
      - run: |
          echo "在 qas 主機上執行："
          echo "  make deploy MODE=<擇一> ENV=qas IMAGE=${{ env.IMAGE }} TAG=${{ github.sha }}"

  # ========== 打 v* tag：發版到 prod（兩個映像加版本標籤，不重 build）==========
  release:
    needs: [test-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 不重 build：把 tag 指到的 commit 的 :sha 映像，加上版本標籤（build-once）
      - run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.ref_name }} \
            ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}

  deploy-prod:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # 在 GitHub 設 required reviewers → 上 prod 需人工核准
    steps:
      # TODO：接上 SSH / docker context 後，改為真的連上 prod 主機執行下列指令
      - run: |
          echo "在 prod 主機上執行："
          echo "  make deploy MODE=<擇一> ENV=prod IMAGE=${{ env.IMAGE }} TAG=${{ github.ref_name }}"
