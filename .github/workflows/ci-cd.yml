name: CI/CD

# main 上的每個 commit 都必須有對應的 :sha 映像——promote、rollback、bisect 都靠這個不變量。
# 所以不設 paths-ignore（純文件 commit 也照建）；重複建置的成本由下方 build cache 吸收。
on:
  push:
    branches: [main]
    tags: ['v*']           # 打 v* tag → 發版到 prod
  pull_request:
    branches: [main]

# 同一個 ref 一次只跑一條：兩個 build 同時寫同一個 GHA cache scope 會互相覆蓋，
# 而且 CD 一旦接上主機，部署順序就需要它。
# PR 例外：新 commit 直接取消舊 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI：後端測試（PR / main / tag 都跑）----------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # ---------- CI：前端建置檢查 ----------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------- CI：部署設定驗證 ----------
  # 呼叫 make check，跟本機同一個 target——定義只有一份，不會漂移。
  # 不啟動容器，只讓 compose 把每種 EXPOSE × ENV 組合渲染出來。
  check-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  # ========== merge 到 main：build 兩個映像（部署由人在主機上執行）==========
  build:
    needs: [test-backend, build-frontend, check-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # cache 匯出需要 buildx 的 container driver；預設 docker driver 不支援 type=gha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}
          # scope 必須分開：兩個 matrix job 共用同一組 cache key 會互相覆寫
          # mode=max 才會快取多階段建置的中間 stage（backend 有 base/dev/runtime）
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 部署指令印在 run summary，把 sha 直接填好省得回頭查。CD 不連線主機——部署是人在
      # 目標主機上跑的。
      # 限定單一 matrix leg：不加這個條件，backend 與 frontend 會各印一份一模一樣的區塊。
      - if: matrix.service == 'backend'
        run: |
          {
            echo "### 部署這個 commit"
            echo "在目標主機上執行（\`EXPOSE\` 依該主機的曝露方式擇一）："
            echo '```bash'
            echo "make deploy EXPOSE=<ports|proxy> ENV=<dev|qas> IMAGE=${{ env.IMAGE }} TAG=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ========== 打 v* tag：把測過的 :sha 加上版本標籤（不重 build）==========
  release:
    needs: [test-backend, build-frontend, check-compose]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 不重 build：把 tag 指到的 commit 的 :sha 映像，加上版本標籤（build-once）
      - run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.ref_name }} \
            ${{ env.IMAGE }}-${{ matrix.service }}:${{ github.sha }}

      # 同 build job：限定單一 matrix leg，否則兩份一模一樣的區塊
      - if: matrix.service == 'backend'
        run: |
          {
            echo "### 發版到 prod"
            echo "在 prod 主機上執行："
            echo '```bash'
            echo "make deploy EXPOSE=<ports|proxy> ENV=prod IMAGE=${{ env.IMAGE }} TAG=${{ github.ref_name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
