name: Cleanup old images

# 想先預覽會刪什麼：把 dry-run 設 true。
on:
  schedule:
    - cron: '0 3 * * 1'      # 每週一 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # package 名 = <repo 名>-<service>（見 ci-cd.yml 的 build job）。從 GITHUB_REPOSITORY 推導
      # 而非寫死，fork 或改名都不必改這個檔案。用 shell 而非 github.event.repository：
      # schedule 事件的 payload 不保證帶 repository 資訊。
      - run: echo "REPO=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ env.REPO }}-backend,${{ env.REPO }}-frontend
          # 只算 :sha 建置（v* 在 exclude-tags 保護，不佔額度）。main 每個 commit 建一顆，
          # 所以這個數字就是 dev/qas 的 rollback 視窗有多深。
          # private repo 的 Packages 儲存計入方案額度（Free 含 500MB），所以這個數字有成本。
          # 真正吃額度的不是 :sha 的數量——各 :sha 之間多半只差 COPY app 那層（base 與 uv sync
          # 共用 blob）——而是每次 pyproject.toml / package-lock.json 變動生出的那份新 base blob。
          keep-n-tagged: 20
          exclude-tags: v*           # 正式版永不刪除——rollback 才有得回
          delete-untagged: true
          dry-run: false
