name: Cleanup old images

# 想先預覽會刪什麼：把 dry-run 設 true。
on:
  schedule:
    - cron: '0 3 * * 1'      # 每週一 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # 兩個服務各一個 package；repo 改名時要一起改
          packages: fullstack-docker-template-multienv-backend,fullstack-docker-template-multienv-frontend
          keep-n-tagged: 10          # 只算 :sha 建置（latest 與 v* 在 exclude-tags 保護，不佔額度）
          exclude-tags: latest,v*
          delete-untagged: true
          dry-run: false
