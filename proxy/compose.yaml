# 共用 reverse proxy（Traefik）——整台機器只跑這一份，所有環境共用。
# 啟動前先建立外部網路：docker network create proxy（Makefile 的 proxy-up 會自動處理）
services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"     # 只導流有貼 traefik.enable=true 的容器
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      # dashboard：本機看路由用；正式環境請關掉或加保護
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"     # Traefik dashboard（http://<host>:8080）
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
