# C：same-host-by-domain——Traefik 依 ${DOMAIN} 導流，三環境可並存（見 docs/deploy-same-host-by-domain.md）。
services:
  frontend:
    networks:
      - default          # 同專案內：frontend ↔ backend
      - proxy            # 對外：Traefik ↔ frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # router/service 名必須帶 APP_ENV：多環境共用同一個 Traefik 時，同名 router 會互相覆蓋
      - "traefik.http.routers.${APP_ENV}-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${APP_ENV}-frontend.entrypoints=web"
      - "traefik.http.services.${APP_ENV}-frontend.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
  default: {}
