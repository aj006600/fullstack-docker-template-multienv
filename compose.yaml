# Base：只定義服務與內部接線；對外曝露由 override 決定（compose.dev.yaml / deploy/compose.*.yaml）。
services:
  backend:
    build: ./backend
    # 本機 build 預設 <APP_NAME>-backend:latest（APP_NAME 由 Makefile 帶入）；
    # make deploy 傳入 IMAGE/TAG 改拉 CI 建好的映像
    image: ${IMAGE:-${APP_NAME:-fullstack}}-backend:${TAG:-latest}
    restart: unless-stopped
    # 兩層：進版控的非機密設定，加上一層同名 .local 的機密疊加（不進版控，每台主機自己建）。
    # required: false 讓沒有 .local 的機器照常啟動；後載入的覆蓋同名變數。
    # 只影響 container 內的環境變數——compose 檔自身的插值（HTTP_PORT、DOMAIN）走 Makefile 的
    # --env-file，讀不到 .local。詳見 docs/deployment.md。
    env_file:
      - env/.env.${APP_ENV:-dev}
      - path: env/.env.${APP_ENV:-dev}.local
        required: false
    # 不對外開埠；由 frontend 的 nginx 以服務名 backend 代理 /api
    # 用 python 而非 curl：bookworm-slim 沒有 curl/wget
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    image: ${IMAGE:-${APP_NAME:-fullstack}}-frontend:${TAG:-latest}
    restart: unless-stopped
    # 等 backend 真的能服務再起 nginx；只等「container 啟動」的話，
    # uvicorn 尚未 listen 的那段時間 /api 會回 502
    depends_on:
      backend:
        condition: service_healthy
