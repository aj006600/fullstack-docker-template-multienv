# Base：只定義服務與內部接線，不決定「對外怎麼曝露」。
# 對外方式由 override 決定：
#   - 本機開發   → compose.dev.yaml       （直接開 localhost 埠、熱重載）
#   - 部署到主機 → deploy/compose.*.yaml   （三種部署模式擇一）
services:
  backend:
    build: ./backend
    restart: unless-stopped
    # 依 APP_ENV 載入對應環境的設定檔（dev/qas/prod）
    env_file:
      - env/.env.${APP_ENV:-dev}
    # 不對外開埠；由同專案的 frontend 以服務名 backend 連線

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
