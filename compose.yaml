services:
  backend:
    build: ./backend
    restart: unless-stopped        # 崩潰/主機重開自動拉回（手動 stop 的保持停著）
    # 依 APP_ENV 載入對應環境的設定檔（dev/qas/prod）
    env_file:
      - env/.env.${APP_ENV:-dev}
    ports:
      - "8000:8000"        # 開著方便本機直接打 http://localhost:8000

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"          # http://localhost:3000
    depends_on:
      - backend
