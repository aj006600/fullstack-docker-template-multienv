# Base：只定義服務與內部接線；對外曝露由 override 決定（compose.dev.yaml / deploy/compose.*.yaml）。
services:
  backend:
    build: ./backend
    # 本機 build 預設 fullstack-backend:latest；make deploy 傳入 IMAGE/TAG 改拉 CI 建好的映像
    image: ${IMAGE:-fullstack}-backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - env/.env.${APP_ENV:-dev}
    # 不對外開埠；由 frontend 的 nginx 以服務名 backend 代理 /api

  frontend:
    build: ./frontend
    image: ${IMAGE:-fullstack}-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
