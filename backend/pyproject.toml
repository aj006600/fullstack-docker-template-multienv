[project]
name = "backend"
version = "0.1.0"
description = "Fullstack multi-env 範本後端（FastAPI + uv）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# E/F=基礎錯誤、I=import 排序、UP=現代語法(PEP 585/604)、N=PEP8 命名、B=bugbear 常見陷阱、PT=pytest 風格
select = ["E", "F", "I", "UP", "N", "B", "PT"]
# B008(勿在參數預設值呼叫函數)與 FastAPI 的 Depends() 寫法衝突,FastAPI 專案標準配置
ignore = ["B008"]
